<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Dashboard · Fedefarma TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@font-face{
  font-family:'Plus Jakarta Sans Fallback';
  src:local('Segoe UI'),local('Roboto'),local('Arial');
  font-weight:300;
  font-style:normal;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface2:#f0f1f4;
  --border:#e4e6eb;
  --border2:#d0d3db;
  --ink:#0d0f14;
  --ink2:#4b5060;
  --ink3:#8c909e;
  --accent:#2563eb;
  --accent-l:#eff4ff;
  --accent-d:#1a44b8;
  --green:#16a34a;
  --green-l:#f0fdf4;
  --green-d:#14532d;
  --red:#dc2626;
  --red-l:#fef2f2;
  --amber:#d97706;
  --amber-l:#fffbeb;
  --purple:#7c3aed;
  --purple-l:#f5f3ff;
  --r:12px;--r-sm:8px;--r-xs:6px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}

@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sc{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.a0{animation:fu .5s cubic-bezier(.22,1,.36,1) both}
.a1{animation:fu .5s .07s cubic-bezier(.22,1,.36,1) both}
.a2{animation:fu .5s .14s cubic-bezier(.22,1,.36,1) both}
.a3{animation:fu .5s .21s cubic-bezier(.22,1,.36,1) both}
.a4{animation:fu .5s .28s cubic-bezier(.22,1,.36,1) both}
.asc{animation:sc .3s cubic-bezier(.22,1,.36,1) both}

.wrap{max-width:960px;margin:0 auto;padding:28px 24px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.hdr-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:16px}
.hdr-date{font-size:11px;color:var(--ink3)}
.hdr-team{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;border:2px solid var(--surface);margin-left:-6px;cursor:default;transition:transform .2s}
.av:first-child{margin-left:0}
.av:hover{transform:scale(1.1);z-index:1}
.av-c{background:var(--accent-l);color:var(--accent-d)}
.av-sg{background:var(--purple-l);color:var(--purple)}
.av-sr{background:var(--green-l);color:var(--green-d)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s,border-color .2s;cursor:default}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border2)}
.kpi-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.kpi-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.kpi-num{font-size:24px;font-weight:600;line-height:1;letter-spacing:-.5px;margin-bottom:3px}
.kpi-lbl{font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:.1px}

/* TABS */
.nav{display:flex;gap:2px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px;box-shadow:var(--shadow)}
.tab{cursor:pointer;font-size:12px;font-weight:500;padding:8px 18px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--ink3);font-family:var(--font);transition:all .18s;letter-spacing:.1px}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 1px 6px rgba(37,99,235,.35)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-hd h3{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.2px}

/* HERO */
.hero{background:var(--ink);border-radius:var(--r);padding:24px 26px;margin-bottom:10px;position:relative;overflow:hidden}
.hero-ring1{position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.hero-ring2{position:absolute;right:-20px;top:-20px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.hero-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.hero-val{font-size:34px;font-weight:600;letter-spacing:-.8px;line-height:1;margin-bottom:4px}
.hero-sub{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:18px}
.hero-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid rgba(255,255,255,.08);padding-top:16px}
.hero-item{padding-right:16px}
.hero-item+.hero-item{padding-right:0;padding-left:16px;border-left:1px solid rgba(255,255,255,.08)}
.hero-item-lbl{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.hero-item-val{font-size:19px;font-weight:600;letter-spacing:-.4px}

/* STRIPS */
.strips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.strip{border-radius:var(--r);padding:14px 16px;border:1px solid transparent}
.sg{background:var(--green-l);border-color:rgba(22,163,74,.15)}
.sr{background:var(--red-l);border-color:rgba(220,38,38,.15)}
.sb{background:var(--accent-l);border-color:rgba(37,99,235,.15)}
.strip-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.strip-val{font-size:20px;font-weight:600;letter-spacing:-.5px}

/* PERSON */
.p-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.p-row:last-child{border-bottom:none;padding-bottom:0}
.p-row:first-child{padding-top:0}
.pav{width:38px;height:38px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.4px}
.pc{background:var(--accent-l);color:var(--accent-d)}
.psg{background:var(--purple-l);color:var(--purple)}
.psr{background:var(--green-l);color:var(--green-d)}
.pav-sm{width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.3px}
.pi{flex:1;min-width:0}
.pname{font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink)}
.prole{font-size:11px;font-weight:400;color:var(--ink3)}
.bar-t{height:5px;background:var(--surface2);border-radius:20px;overflow:hidden;margin-bottom:3px}
.bar-f{height:5px;border-radius:20px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.pstat{font-size:11px;color:var(--ink3)}

/* PILLS */
.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.p-alta{background:#fee2e2;color:#991b1b}
.p-media{background:#fef3c7;color:#92400e}
.p-baja{background:#dcfce7;color:#14532d}
.p-pendiente{background:var(--accent-l);color:var(--accent-d)}
.p-progreso{background:#fef3c7;color:#92400e}
.p-completada{background:#dcfce7;color:#14532d}
.p-activo{background:#dcfce7;color:#14532d}
.p-evaluando{background:#fef3c7;color:#92400e}
.p-descartado{background:var(--surface2);color:var(--ink3)}
.p-save{background:#dcfce7;color:#14532d}
.p-cost{background:#fee2e2;color:#991b1b}
.tg{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--ink3);font-weight:500}

/* TASKS */
.t-row{display:flex;align-items:flex-start;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);transition:background .15s;border-radius:var(--r-xs);margin-left:-4px}
.t-row:last-child{border-bottom:none}
.t-row:hover{background:var(--surface2)}
.tck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--surface)}
.tck:hover{border-color:var(--accent)}
.tck.done{background:var(--green);border-color:var(--green)}
.tck.done::after{content:'';display:block;width:9px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.tm{flex:1;min-width:0}
.tn{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn.done{text-decoration:line-through;color:var(--ink3);font-weight:400}
.tmeta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}

/* DIVIDER */
.div{height:1px;background:var(--border);margin:10px 0}

/* FORMS */
.btn{cursor:pointer;font-size:12px;font-weight:500;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--font);transition:all .15s;box-shadow:var(--shadow)}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn:active{transform:scale(.98)}
.btn-acc{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 6px rgba(37,99,235,.3)}
.btn-acc:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn-sm{font-size:11px;padding:6px 12px;border-radius:var(--r-xs)}
.btn-del{color:var(--red);border-color:#fecaca;background:transparent;box-shadow:none}
.btn-del:hover{background:var(--red-l)}
.btn-track{color:var(--accent);border-color:var(--accent-l);background:var(--accent-l);box-shadow:none}
.btn-track:hover{background:#dbeafe;border-color:#bfdbfe}
input,select,textarea{font-family:var(--font);font-size:12px;font-weight:400;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
label{font-size:10px;font-weight:600;color:var(--ink3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.4px}
.form-p{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;animation:sc .2s ease}
.fg{display:grid;gap:8px;margin-bottom:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}

/* CHART */
.chart-w{position:relative;width:100%}

/* BAL TABLE */
.b-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.b-row:last-child{border-bottom:none}
.b-lbl{font-size:12px;color:var(--ink2)}
.b-val{font-size:15px;font-weight:600;letter-spacing:-.3px}

/* SERVICE */
.s-row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.s-row:last-child{border-bottom:none}

.empty{text-align:center;padding:2.5rem 0;color:var(--ink3)}
.empty-ic{width:40px;height:40px;border-radius:50%;background:var(--surface2);margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl select{width:auto;font-size:11px;padding:5px 9px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:sc .25s cubic-bezier(.22,1,.36,1)}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 0}
.modal-hd h2{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.3px;flex:1;margin-right:12px}
.modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink3);flex-shrink:0;transition:all .15s}
.modal-close:hover{background:var(--border);color:var(--ink)}
.modal-body{padding:16px 20px 20px}
.modal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

/* TIMELINE */
.tl-item{display:flex;gap:10px;padding:8px 0;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:13px;top:28px;bottom:-4px;width:1px;background:var(--border)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.2px}
.tl-content{flex:1;min-width:0;padding-top:4px}
.tl-title{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:2px}
.tl-time{font-size:10px;color:var(--ink3)}
.tl-note{font-size:11px;color:var(--ink2);margin-top:3px;padding:6px 8px;background:var(--surface2);border-radius:6px}

/* WEEK INDICATOR */
.week-bar{background:var(--surface2);border-radius:6px;overflow:hidden;height:6px;margin-top:4px}
.week-fill{height:6px;border-radius:6px;background:var(--accent);transition:width .6s}

@media(max-width:700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .two-col,.strips,.g2,.g3,.g4{grid-template-columns:1fr}
  .nav{flex-wrap:wrap}
  .hero-row{grid-template-columns:1fr}
  .hero-item+.hero-item{border-left:none;border-top:1px solid rgba(255,255,255,.08);padding-left:0;padding-top:12px;margin-top:12px}
  .wrap{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <div id="modal-root"></div>
</div>

<script>
const MB=[
  {id:'carlos',name:'Carlos',role:'Ingeniero',av:'CA',pc:'pc',col:'#2563eb',email:'cgomezr@fedefarma.com'},
  {id:'sergi-g',name:'Sergi G.',role:'Ingeniero',av:'SG',pc:'psg',col:'#7c3aed',email:'sgarciag@fedefarma.com'},
  {id:'sergi-r',name:'Sergi R.',role:'Administrativo',av:'SR',pc:'psr',col:'#16a34a',email:'sramirez@fedefarma.com'}
];
const CATS=['Infraestructura','Soporte','Administración','Proyectos','Seguridad','Otro'];
const MOS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const STATUS_LABELS={pendiente:'Pendiente',progreso:'En progreso',completada:'Completada'};

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let tasks=ld('fdp_tasks',[]);
let services=ld('fdp_services',[]);
let tab=ld('fdp_tab','resumen');
let addT=false,addS=false,fSt='todos',fPr='todos';
let CH={};
let activeModal=null;

function fmt(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0)}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmtDate(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function fmtDateTime(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

// Get month index from startDate for chart grouping
function taskMonth(t){
  if(t.startDate){const d=new Date(t.startDate);return d.getMonth();}
  return Number(t.month)||0;
}

// Week progress: how many weeks elapsed vs total weeks
function weekProgress(t){
  if(!t.startDate||!t.weeks)return null;
  const start=new Date(t.startDate);
  const end=new Date(start.getTime()+Number(t.weeks)*7*24*3600*1000);
  const now=new Date();
  const total=end-start;
  const elapsed=Math.min(Math.max(now-start,0),total);
  return{pct:Math.round(elapsed/total*100),start,end,weeks:t.weeks};
}

function kp(){
  const done=tasks.filter(t=>t.status==='completada');
  const saving=tasks.reduce((a,t)=>a+Number(t.saving||0),0);
  const cost=tasks.reduce((a,t)=>a+Number(t.cost||0),0);
  const svcCost=services.reduce((a,s)=>a+Number(s.cost||0),0);
  const svcSaving=services.reduce((a,s)=>a+Number(s.saving||0),0);
  return{
    total:tasks.length,done:done.length,
    pend:tasks.filter(t=>t.status==='pendiente').length,
    prog:tasks.filter(t=>t.status==='progreso').length,
    crit:tasks.filter(t=>t.importance==='alta'&&t.status!=='completada').length,
    saving,cost,svcCost,svcSaving
  };
}

function dCh(){Object.values(CH).forEach(c=>{try{c.destroy()}catch(e){}});CH={}}

// ── SEND NOTIFICATION EMAIL ────────────────────────────────────────────────
function sendNotif(task, type, note=''){
  const assignee=MB.find(x=>x.id===task.person)||MB[0];
  const assigner=MB.find(x=>x.id===task.assignedBy);
  let subject,body;
  if(type==='new'){
    subject=`Nueva tarea asignada: ${task.name}`;
    body=`Hola ${assignee.name},\n\nSe te ha asignado una nueva tarea en el panel de gestión Fedefarma TI:\n\n  Tarea: ${task.name}\n  Importancia: ${task.importance}\n  Categoría: ${task.category||'—'}\n  Duración estimada: ${task.weeks||'—'} semana(s)\n  Inicio: ${fmtDate(task.startDate)}\n${assigner?'\n  Asignada por: '+assigner.name:''}\n${task.notes?'\n  Notas: '+task.notes:''}\n\nSaludos,\nDepartamento de Organización · Fedefarma TI`;
  }else if(type==='status'){
    subject=`Actualización de estado: ${task.name}`;
    const recipients=[assignee];
    if(assigner&&assigner.id!==assignee.id)recipients.push(assigner);
    const emails=recipients.map(p=>p.email).join(',');
    body=`Hola,\n\nEl estado de la siguiente tarea ha cambiado:\n\n  Tarea: ${task.name}\n  Nuevo estado: ${STATUS_LABELS[task.status]}\n  Asignada a: ${assignee.name}\n${assigner?'  Asignada por: '+assigner.name:''}\n${note?'\n  Nota: '+note:''}\n\nSaludos,\nDepartamento de Organización · Fedefarma TI`;
    window.open(`mailto:${emails}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,'_blank');
    return;
  }
  window.open(`mailto:${assignee.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,'_blank');
}

// ── MODAL ──────────────────────────────────────────────────────────────────
function openModal(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  activeModal=id;
  renderModal(t);
}

function closeModal(){
  activeModal=null;
  document.getElementById('modal-root').innerHTML='';
}

function renderModal(t){
  const m=MB.find(x=>x.id===t.person)||MB[0];
  const ma=MB.find(x=>x.id===t.assignedBy);
  const wp=weekProgress(t);
  const hist=t.history||[];
  document.getElementById('modal-root').innerHTML=`
<div class="modal-ov" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <div class="modal-hd">
    <h2>${t.name}</h2>
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
  </div>
  <div class="modal-body">
    <div class="modal-meta">
      <span class="pill p-${t.importance}">${t.importance}</span>
      <span class="pill p-${t.status}">${STATUS_LABELS[t.status]}</span>
      ${t.category?`<span class="tg">${t.category}</span>`:''}
      ${t.cost>0?`<span class="pill p-cost">coste: ${fmt(t.cost)}</span>`:''}
      ${t.saving>0?`<span class="pill p-save">ahorro: ${fmt(t.saving)}</span>`:''}
    </div>

    <!-- Asignación -->
    <div class="modal-section">
      <div class="modal-section-title">Asignación</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="pav-sm ${m.pc}">${m.av}</div>
          <div><div style="font-size:10px;color:var(--ink3);margin-bottom:1px">Asignada a</div><div style="font-size:12px;font-weight:500">${m.name}</div></div>
        </div>
        ${ma?`<div style="display:flex;align-items:center;gap:7px">
          <div class="pav-sm ${ma.pc}">${ma.av}</div>
          <div><div style="font-size:10px;color:var(--ink3);margin-bottom:1px">Asignada por</div><div style="font-size:12px;font-weight:500">${ma.name}</div></div>
        </div>`:''}
      </div>
    </div>

    <!-- Planificación -->
    ${t.startDate?`<div class="modal-section">
      <div class="modal-section-title">Planificación</div>
      <div style="font-size:12px;color:var(--ink2);margin-bottom:6px">Inicio: <strong>${fmtDate(t.startDate)}</strong> &middot; Duración: <strong>${t.weeks} semana${t.weeks!=1?'s':''}</strong>${wp?` &middot; Fin: <strong>${fmtDate(wp.end)}</strong>`:''}
      </div>
      ${wp&&t.status!=='completada'?`<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-bottom:4px"><span>Progreso temporal</span><span>${wp.pct}%</span></div>
      <div class="week-bar"><div class="week-fill" style="width:${wp.pct}%;background:${wp.pct>100?'#dc2626':wp.pct>80?'#d97706':'#2563eb'}"></div></div>`:''}

    ${t.notes?`<div class="modal-section">
      <div class="modal-section-title">Notas</div>
      <div style="font-size:12px;color:var(--ink2);padding:10px;background:var(--surface2);border-radius:8px">${t.notes}</div>
    </div>`:''}

    <!-- Cambiar estado -->
    <div class="modal-section">
      <div class="modal-section-title">Actualizar estado</div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">

            <option value="completada" ${t.status==='completada'?'selected':''}>Completada</option>
          </select>
        </div>
        <div style="flex:2;min-width:160px">
          <input id="modal-note" placeholder="Nota de seguimiento (opcional)" style="margin-bottom:0">
        </div>
        <button class="btn btn-acc btn-sm" onclick="updateStatus('${t.id}')">Guardar y notificar</button>
      </div>
    </div>

    <!-- Historial -->
    <div class="modal-section">
      <div class="modal-section-title">Historial de seguimiento</div>
      ${hist.length===0?`<div style="font-size:12px;color:var(--ink3);text-align:center;padding:16px 0">Sin actualizaciones aún</div>`:
        [...hist].reverse().map(h=>`
        <div class="tl-item">
          <div class="tl-dot p-${h.status}" style="background:${h.status==='completada'?'#dcfce7':h.status==='progreso'?'#fef3c7':'#eff4ff'};color:${h.status==='completada'?'#14532d':h.status==='progreso'?'#92400e':'#1a44b8'}">${h.status==='completada'?'✓':h.status==='progreso'?'▶':'·'}</div>

            <div class="tl-time">${fmtDateTime(h.date)} &middot; ${h.by}</div>

      <button class="btn btn-del btn-sm" onclick="if(confirm('¿Eliminar tarea?')){delT('${t.id}');closeModal()}">Eliminar tarea</button>
    </div>
  </div>
</div>
</div>`;
}

function updateStatus(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  const newStatus=document.getElementById('modal-status').value;
  const note=(document.getElementById('modal-note').value||'').trim();
  const prevStatus=t.status;
  t.status=newStatus;
  if(!t.history)t.history=[];
  const actor=MB.find(x=>x.id===t.assignedBy)||MB[0];
  t.history.push({status:newStatus,date:new Date().toISOString(),by:actor.name,note});
  sv('fdp_tasks',tasks);
  // send email notification
  sendNotif(t,'status',note);
  renderModal(t);
  // refresh underlying view
  if(tab==='tareas'||tab==='resumen'){rTab();}
}

function setTab(t){tab=t;sv('fdp_tab',t);dCh();document.getElementById('tc').innerHTML='';document.querySelectorAll('.tab').forEach(el=>{el.classList.toggle('active',el.getAttribute('onclick')==="setTab('"+t+"')")});rTab()}

function rTab(){
  const el=document.getElementById('tc');
  if(tab==='resumen')el.innerHTML=bRes();
  else if(tab==='tareas')el.innerHTML=bTar();
  else if(tab==='gráficos')el.innerHTML=bGraf();
  else if(tab==='ahorros')el.innerHTML=bAh();
  else if(tab==='servicios')el.innerHTML=bSer();
  setTimeout(()=>{
    if(tab==='gráficos')iGraf();
    if(tab==='ahorros')iAh();
  },80);

function iGraf(){
  const done=tasks.filter(t=>t.status==='completada').length;
  const pend=tasks.filter(t=>t.status==='pendiente').length;
  const prog=tasks.filter(t=>t.status==='progreso').length;
  const alta=tasks.filter(t=>t.importance==='alta').length;
  const media=tasks.filter(t=>t.importance==='media').length;
  const baja=tasks.filter(t=>t.importance==='baja').length;
  const bC=CATS.map(c=>tasks.filter(t=>t.category===c).length);
  // Group by month using startDate if available
  const bM=MOS.map((_,i)=>tasks.filter(t=>t.status==='completada'&&taskMonth(t)===i).length);
  const fn={size:11,family:"'Plus Jakarta Sans',sans-serif"};
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:fn,boxWidth:10,padding:12,color:'#8c909e'}}}};
  const sc2={y:{beginAtZero:true,ticks:{stepSize:1,font:fn,color:'#8c909e'},grid:{color:'rgba(0,0,0,.04)'}},x:{ticks:{font:fn,color:'#8c909e'},grid:{display:false}}};
  if(done+pend+prog>0)CH.s=new Chart(document.getElementById('cs'),{type:'doughnut',data:{labels:['Completadas','Pendientes','En progreso'],datasets:[{data:[done,pend,prog],backgroundColor:['#16a34a','#2563eb','#d97706'],borderWidth:0,hoverOffset:5}]},options:{...base,cutout:'72%'}});
  if(alta+media+baja>0)CH.i=new Chart(document.getElementById('ci'),{type:'doughnut',data:{labels:['Alta','Media','Baja'],datasets:[{data:[alta,media,baja],backgroundColor:['#dc2626','#d97706','#16a34a'],borderWidth:0,hoverOffset:5}]},options:{...base,cutout:'72%'}});
  CH.c=new Chart(document.getElementById('cc'),{type:'bar',data:{labels:CATS.map(c=>c.slice(0,7)),datasets:[{data:bC,backgroundColor:'#eff4ff',borderColor:'#2563eb',borderWidth:1.5,borderRadius:8,borderSkipped:false}]},options:{...base,plugins:{legend:{display:false}},scales:sc2}});
  CH.m=new Chart(document.getElementById('cm'),{type:'bar',data:{labels:MOS.map(m=>m.slice(0,3)),datasets:[{data:bM,backgroundColor:'#f0fdf4',borderColor:'#16a34a',borderWidth:1.5,borderRadius:7,borderSkipped:false}]},options:{...base,plugins:{legend:{display:false}},scales:sc2}});
}

// ── AHORROS ────────────────────────────────────────────────────────────────

  const k=kp();
  const totalBenefit=k.saving+k.svcSaving;
  const svcs=services.filter(s=>s.saving>0||s.cost>0);
  return`
<div class="card a0" style="margin-bottom:14px"><div class="strip sg" style="border-radius:var(--r);padding:24px;text-align:center"><div class="strip-lbl" style="color:#14532d;font-size:11px">AHORRO ACUMULADO</div><div class="strip-val" style="color:#16a34a;font-size:32px">${fmt(totalBenefit)}</div></div></div>
<div class="card a1"><div class="card-hd"><h3>Ahorro acumulado por mes</h3></div><div class="chart-w" style="height:280px"><canvas id="csa"></canvas></div></div>

  <div class="card-hd"><h3>Resumen de servicios</h3><span class="chip" style="background:#dcfce7;color:#14532d">${svcs.length} servicios</span></div>

      <div class="tmeta"><span style="font-size:11px;color:var(--ink3)">${s.provider}</span><span class="tg">${s.type}</span><span class="pill p-${s.status}">${s.status}</span></div>
    </div>
    <div style="display:flex;gap:5px;flex-shrink:0">
      ${s.saving>0?`<span class="pill p-save" style="font-size:11px;padding:3px 9px">ahorro: +${fmt(s.saving)}</span>`:''}

function iAh(){
  const now=new Date();
  const currentMonth=now.getMonth();
  const currentYear=now.getFullYear();
  
  // Crear array de ahorros mensuales para TODO EL AÑO (12 meses)
  const savingsByMonth=new Array(12).fill(0);
  
  // Agregar ahorros de tareas
  tasks.forEach(t=>{
    if(t.saving>0){
      if(t.savingDate){
        const d=new Date(t.savingDate);
        if(d.getFullYear()===currentYear){
          const m=d.getMonth();
          if(m>=0&&m<=currentMonth){
            savingsByMonth[m]+=Number(t.saving||0);
          }
        }
      }
    }
  });
  
  // Agregar servicios según su fecha (o en enero si no tienen fecha)
  services.forEach(s=>{
    if(s.saving>0){
      if(s.savingDate){
        const d=new Date(s.savingDate);
        if(d.getFullYear()===currentYear){
          const m=d.getMonth();
          if(m>=0&&m<=currentMonth){
            savingsByMonth[m]+=Number(s.saving||0);
          }
        }
      }else{
        // Si no tiene fecha, contar en enero
        savingsByMonth[0]+=Number(s.saving||0);
      }
    }
  });
  
  // Calcular acumulado pero con nulls después del mes actual
  let ac=0;
  const acum=savingsByMonth.map((v,i)=>{
    if(i<=currentMonth){
      ac+=v;
      return ac;
    }
    return null;
  });
  
  // Labels para TODO EL AÑO
  const monthLabels=MOS.map(m=>m.slice(0,3));
  
  const fn={size:11,family:"'Plus Jakarta Sans',sans-serif"};
  const ctx=document.getElementById('csa');
  if(CH.sa){CH.sa.destroy();}
  
  CH.sa=new Chart(ctx,{
    type:'line',
    data:{
      labels:monthLabels,
      datasets:[{
        label:'Ahorro acumulado',
        data:acum,
        borderColor:'#16a34a',
        backgroundColor:'rgba(22,163,74,0.1)',
        borderWidth:3,
        fill:true,
        tension:0.4,
        pointRadius:6,
        pointBackgroundColor:'#16a34a',
        pointBorderColor:'#fff',
        pointBorderWidth:2,
        spanGaps:false
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'bottom',labels:{font:fn,padding:15,color:'#8c909e'}},
        tooltip:{backgroundColor:'rgba(0,0,0,0.8)',padding:10,titleFont:{size:12},bodyFont:{size:11},callbacks:{label:c=>{if(c.parsed.y===null)return'';return fmt(c.parsed.y)}}}
      },
      scales:{
        y:{
          beginAtZero:true,
          ticks:{font:fn,color:'#8c909e',callback:v=>fmt(v)},
          grid:{color:'rgba(0,0,0,0.05)',drawBorder:false}
        },
        x:{
          ticks:{font:fn,color:'#8c909e'},
          grid:{display:false,drawBorder:false}
        }
      }
    }
  });
}

  return`

// ── ACTIONS ────────────────────────────────────────────────────────────────
function tgT(){addT=!addT;rTab()}
function tgS(){addS=!addS;rTab()}
function setF(t,v){if(t==='s')fSt=v;else fPr=v;rTab()}

function addTask(){
  const n=(document.getElementById('tn').value||'').trim();
  if(!n)return;
  const person=document.getElementById('tp').value;
  const assignedBy=document.getElementById('tab2').value;
  const startDate=document.getElementById('tstart').value||null;
  const weeks=Number(document.getElementById('tweeks').value)||null;
  const cost=Number(document.getElementById('tcost').value)||0;
  const saving=Number(document.getElementById('tsv').value)||0;
  const savingDate=document.getElementById('tsv_date').value||null;
  const status=document.getElementById('ts').value;
  const newTask={
    id:uid(),name:n,person,assignedBy,
    importance:document.getElementById('ti').value,
    status,category:document.getElementById('tc2').value,
    cost,saving,savingDate,startDate,weeks,
    notes:(document.getElementById('tno').value||'').trim(),
    history:[{status,date:new Date().toISOString(),by:MB.find(x=>x.id===assignedBy)?.name||'Sistema',note:'Tarea creada'}]
  };
  tasks.push(newTask);
  sv('fdp_tasks',tasks);addT=false;render();
  sendNotif(newTask,'new');
}

function addSv(){
  const n=(document.getElementById('sn').value||'').trim();
  if(!n)return;
  services.push({name:n,provider:(document.getElementById('spv').value||'').trim()||'—',cost:Number(document.getElementById('sc2').value)||0,saving:Number(document.getElementById('ssv').value)||0,savingDate:document.getElementById('ssv_date').value||null,type:document.getElementById('sty').value,status:document.getElementById('sst').value,notes:(document.getElementById('sno').value||'').trim()});
  sv('fdp_services',services);addS=false;rTab();
}

function chSt(id,v){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  t.status=v;
  if(!t.history)t.history=[];
  t.history.push({status:v,date:new Date().toISOString(),by:'Sistema',note:''});
  sv('fdp_tasks',tasks);rTab();
}

function cyc(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  const s=['pendiente','progreso','completada'];
  const newStatus=s[(s.indexOf(t.status)+1)%3];
  t.status=newStatus;
  if(!t.history)t.history=[];
  t.history.push({status:newStatus,date:new Date().toISOString(),by:'Sistema',note:''});
  sv('fdp_tasks',tasks);rTab();
}

function delT(id){if(confirm('¿Eliminar esta tarea?')){tasks=tasks.filter(t=>t.id!==id);sv('fdp_tasks',tasks);render()}}
function delS(i){if(confirm('¿Eliminar este servicio?')){services.splice(i,1);sv('fdp_services',services);rTab()}}

render();
</script>
